<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Lista Compartilhada 2026</title>
    <link rel="stylesheet" href="src/css/login.css">
    <!-- VLibras -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Botão de tema -->
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema escuro/claro">
            <i class="fas fa-moon"></i>
        </button>

        <div class="logo-wrapper">
            <img src="src/css/icons/icons_144x144.png" alt="">
            <h2 class="titulo">Lista 2026</h2>
            <p class="subtitulo">Sua lista de compras compartilhada</p>
        </div>

        <!-- Formulário de login -->
        <div class="form-group">
            <label for="email">
                <i class="fas fa-envelope"></i> E-mail
            </label>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
            <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
            <label for="senha">
                <i class="fas fa-lock"></i> Senha
            </label>
            <div class="password-wrapper">
                <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="error-message" id="senhaError"></div>
        </div>

        <div class="forgot-password">
            <a href="#" id="forgotPassword">Esqueceu sua senha?</a>
        </div>

        <div class="botoes">
            <button class="btn-primary" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
            <button class="btn-secondary" id="btnCadastro">
                <i class="fas fa-user-plus"></i> Criar conta
            </button>
        </div>

        <!-- Divisor -->
        <div class="divider">
            <span>ou continue com</span>
        </div>

        <!-- Social Login -->
        <div class="social-login">
            <button class="social-btn google" id="googleLogin">
                <i class="fab fa-google"></i> Google
            </button>
            <button class="social-btn facebook" id="facebookLogin">
                <i class="fab fa-facebook-f"></i> Facebook
            </button>
            <button class="social-btn apple" id="appleLogin">
                <i class="fab fa-apple"></i> Apple
            </button>
        </div>

        <!-- Termos -->
        <p class="terms">
            Ao continuar, você concorda com nossos <a href="#">Termos de uso</a> e <a href="#">Política de privacidade</a>
        </p>
    </div>

    <!-- Feedback sonoro (áudio oculto) -->
    <audio id="successSound" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
    </audio>
    <audio id="errorSound" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/error-01.mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="auth.js"></script>
    <script>
        // Inicializar VLibras
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
</body>
</html>
